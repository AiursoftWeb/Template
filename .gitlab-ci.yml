stages:
    - s360
    - build
    - validate
    - publish
    - deploy

# Prefer the merge request pipeline once a branch has an open MR, so the same
# validation suite is not run twice for a single push.
workflow:
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
          when: never
        - if: '$CI_COMMIT_BRANCH == "master"'
          variables:
              S360_PURPOSE: baseline
              S360_CHECK_KEY: "$S360_BASELINE_KEY"
        - if: '$CI_COMMIT_BRANCH'

before_script:
    - |
      set -- ./*.sln
      if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
        echo "Expected exactly one .sln file in the repository root." >&2
        exit 1
      fi
      export SOLUTION_FILE="$1"
    # CI uses the company NuGet source approved by S360. Keep nuget.org in the
    # checked-in config for external contributors, but do not bypass CI policy.
    - |
      cat > nuget.config << 'NUGETEOF'
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
          <packageSources>
              <clear />
              <add key="aiursoft" value="https://nupkg.aiursoft.com/v3/index.json" />
          </packageSources>
      </configuration>
      NUGETEOF
    # External tools come from the Runner. Never install or update them here.
    - export PATH="$HOME/.dotnet/tools:$PATH"
    - command -v dotnet          || { echo "Runner is missing dotnet." >&2; exit 1; }
    - command -v jb              || { echo "Runner is missing jb." >&2; exit 1; }
    - command -v reportgenerator || { echo "Runner is missing reportgenerator." >&2; exit 1; }
    # Refresh internal clients globally from the internal source only.
    - dotnet tool update --global Aiursoft.S360.Client --source https://nupkg.aiursoft.com/v3/index.json
    - dotnet tool update --global Aiursoft.Apkg.Client --source https://nupkg.aiursoft.com/v3/index.json
    - s360 --version
    - apkg --version
    - 'echo "Hostname: $(hostname)"'
    - "dotnet --info"

variables:
    GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_PROJECT_NAME/$CI_PIPELINE_ID/$CI_JOB_ID"
    MSBUILDDISABLENODEREUSE: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    npm_config_registry: "https://nopkg.aiursoft.com/npm/"
    npm_config_replace_registry_host: "always"
    S360_PURPOSE: review
    S360_CHECK_KEY: ""

s360:
    stage: s360
    script:
        - dotnet restore "$SOLUTION_FILE" --use-lock-file --disable-parallel --no-cache --configfile nuget.config --packages "$CI_PROJECT_DIR/obj/s360-packages"
        - s360 check --path "$SOLUTION_FILE" --ecosystem nuget --purpose "$S360_PURPOSE"
    artifacts:
        expire_in: 1 day
        paths:
            - "**/packages.lock.json"
    retry:
        max: 2
        # Policy rejection must stop immediately, without retrying the audit.
        when: runner_system_failure

s360_npm:
    stage: s360
    script:
        - s360 check --path . --ecosystem npm --npm-lockfile-only --npm-registry "$npm_config_registry" --purpose "$S360_PURPOSE"
    rules:
        - exists:
              - "**/package.json"
    retry:
        max: 2
        when: runner_system_failure

build:
    stage: build
    needs:
        - s360
        - job: s360_npm
          optional: true
          artifacts: false
    script:
        # Job directories differ. Restore the audited versions and content hashes
        # from the lock files instead of reusing another job's absolute paths.
        - dotnet restore "$SOLUTION_FILE" --locked-mode --disable-parallel --no-cache --configfile nuget.config --packages "$CI_PROJECT_DIR/obj/s360-packages"
        - dotnet build "$SOLUTION_FILE" -maxcpucount:1 --no-self-contained --no-restore
    retry:
        max: 2
        when: runner_system_failure

lint:
    stage: validate
    needs:
        - build
    script:
        - chmod +x ./lint.sh
        - ./lint.sh
    artifacts:
        when: always
        expire_in: 1 day
        paths:
            - ./analyze_output.xml
    retry:
        max: 2
        when: script_failure

test:
    stage: validate
    needs:
        - build
    coverage: '/TOTAL_COVERAGE=(\d+.\d+)/'
    script:
        - dotnet test "$SOLUTION_FILE" --collect:"XPlat Code Coverage" --logger "junit;MethodFormat=Class;FailureBodyFormat=Verbose" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCodeAttribute
        - reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"." -reporttypes:"cobertura"
        - COVERAGE_VALUE=$(grep -oPm 1 'line-rate="\K([0-9.]+)' "./Cobertura.xml")
        - COVERAGE_PERCENTAGE=$(echo "scale=2; $COVERAGE_VALUE * 100" | bc)
        - 'echo "TOTAL_COVERAGE=$COVERAGE_PERCENTAGE%"'
    artifacts:
        when: always
        expire_in: 1 day
        paths:
            - ./**/TestResults.xml
            - ./Cobertura.xml
        reports:
            junit:
                - ./**/TestResults.xml
            coverage_report:
                coverage_format: cobertura
                path: ./Cobertura.xml
    retry:
        max: 2
        when: script_failure

validate_docker:
    stage: validate
    timeout: 3h
    needs:
        - build
    script:
        - docker buildx version
        - docker buildx use aiur-global-builder
        - docker buildx build . --platform linux/amd64,linux/arm64 --build-arg NUGET_SOURCE=https://nupkg.aiursoft.com/v3/index.json --build-arg NPM_REGISTRY=https://nopkg.aiursoft.com/npm/
    rules:
        - exists:
              - Dockerfile

validate_apkg:
    stage: validate
    needs:
        - build
    script:
        - |
            aosproj_files=$(find . -type f -name '*.aosproj')
            if [ -z "$aosproj_files" ]; then
              echo "No .aosproj files found. Skipping APKG validation."
              exit 0
            fi

            echo "$aosproj_files" | while IFS= read -r aosproj_file; do
              echo "Building APKG project: $aosproj_file"
              apkg build --path "$(dirname "$aosproj_file")" --all || exit 1
            done

pack:
    stage: publish
    needs:
        - lint
        - test
        - validate_apkg
        # validate_docker is absent when this template has no Dockerfile. If the
        # job exists, pack still waits for it to succeed.
        - job: validate_docker
          optional: true
    script:
        - dotnet build -maxcpucount:1 --configuration Release --no-self-contained -p:GeneratePackageOnBuild=false "$SOLUTION_FILE"
        - dotnet pack -maxcpucount:1 --configuration Release --no-build --output "$CI_PROJECT_DIR/artifacts/nuget" "$SOLUTION_FILE"
    artifacts:
        expire_in: 1 week
        paths:
            - "artifacts/nuget/*.nupkg"

deploy_local_nuget:
    stage: deploy
    environment: production
    needs:
        - pack
    script:
        - |
            for file in artifacts/nuget/*.nupkg; do
              [ -f "$file" ] || continue
              : "${NUPKG_API_KEY:?NuGet publishing credential is required}"
              dotnet nuget push "$file" --api-key "$NUPKG_API_KEY" --source "https://nupkg.aiursoft.com/v3/index.json" --timeout 1200 --skip-duplicate || exit 1
            done
    rules:
        - if: '$CI_COMMIT_BRANCH == "master"'

deploy_public_nuget:
    stage: deploy
    environment: production
    needs:
        - pack
    script:
        - |
            for file in artifacts/nuget/*.nupkg; do
              [ -f "$file" ] || continue
              : "${NUGET_API_KEY:?NuGet publishing credential is required}"
              dotnet nuget push "$file" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --timeout 1200 --skip-duplicate || exit 1
            done
    rules:
        - if: '$CI_COMMIT_BRANCH == "master"'

.docker_release:
    stage: deploy
    timeout: 3h
    retry:
        max: 2
    variables:
        HOME_IMAGE: "hub.aiursoft.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
    rules:
        - if: '$CI_COMMIT_BRANCH == "master"'
          exists:
              - Dockerfile

build_docker_image:
    extends: .docker_release
    environment:
        name: production
        action: prepare
    needs:
        - job: pack
          artifacts: false
    script:
        - printf '%s\n' "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
        - |
            staged_image="$HOME_IMAGE:ci-$CI_PIPELINE_ID-$CI_JOB_ID"
            docker buildx build . --builder aiur-global-builder --platform linux/amd64,linux/arm64 \
              --build-arg NUGET_SOURCE=https://nupkg.aiursoft.com/v3/index.json \
              --build-arg NPM_REGISTRY=https://nopkg.aiursoft.com/npm/ \
              --tag "$staged_image" \
              --annotation "index:com.aiursoft.gitlab.release=$CI_PIPELINE_ID.$CI_JOB_ID" \
              --metadata-file image-build.json --output type=registry,oci-mediatypes=true
            digest=$(jq -er '."containerimage.digest" | strings | select(test("^sha256:[0-9a-f]{64}$"))' image-build.json)
            docker buildx imagetools inspect --raw "$staged_image" > image-index.json
            printf '%s  image-index.json\n' "${digest#sha256:}" | sha256sum --check
            jq -e --arg release "$CI_PIPELINE_ID.$CI_JOB_ID" '.annotations["com.aiursoft.gitlab.release"] == $release' image-index.json > /dev/null
            echo "Staged $staged_image at $digest"
    artifacts:
        expire_in: 1 week
        paths:
            - image-index.json

deploy_docker_all:
    extends: .docker_release
    environment: production
    resource_group: docker-latest
    allow_failure:
        exit_codes: 42 # Superseded releases do not count as successful deployments.
    retry:
        max: 2
        when: [runner_system_failure, stuck_or_timeout_failure, job_execution_timeout, api_failure]
        exit_codes: 1
    variables:
        GIT_STRATEGY: empty
    needs:
        - job: build_docker_image
          artifacts: true
    before_script: []
    script:
        - |
            trap 'exit 1' ERR
            digest="sha256:$(sha256sum image-index.json | cut -d' ' -f1)"
            candidate_release=$(jq -er '.annotations["com.aiursoft.gitlab.release"] | select(test("^[0-9]+\\.[0-9]+$"))' image-index.json)
            source="$HOME_IMAGE@$digest"
            hub_namespace="$CI_PROJECT_NAMESPACE"
            if [ "$hub_namespace" = "anduin" ]; then hub_namespace=anduin2019; fi
            public_image="docker.io/$hub_namespace/$CI_PROJECT_NAME"

            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
            printf '%s\n' "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
            # Only a missing tag is a first release. A registry or login error must stop publication.
            registry_auth=$(printf '%s:%s' "$LOCAL_DOCKER_USERNAME" "$LOCAL_DOCKER_PASSWORD" | base64 -w0)
            http_status=$(printf 'Authorization: Basic %s\n' "$registry_auth" | \
              curl --silent --show-error --header @- --output current-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://hub.aiursoft.com/v2/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/manifests/latest")
            case "$http_status" in
              200) current_release=$(jq -er '.annotations["com.aiursoft.gitlab.release"] // "0.0" | select(test("^[0-9]+\\.[0-9]+$"))' current-index.json) ;;
              404) current_release=0.0 ;;
              *) echo "Could not read $HOME_IMAGE:latest (HTTP $http_status)." >&2; exit 1 ;;
            esac
            # Pipeline then build job orders retries even when two builds use the same Git commit.
            if [ "$(printf '%s\n' "$current_release" "$candidate_release" | sort -V | tail -1)" != "$candidate_release" ]; then
              echo "Release $candidate_release was superseded by $current_release. Both latest tags were left untouched."
              exit 42
            fi

            publish() {
              docker buildx imagetools create --tag "$1:latest" "$source"
              docker buildx imagetools inspect --raw "$1:latest" > published-index.json
              actual="sha256:$(sha256sum published-index.json | cut -d' ' -f1)"
              if [ "$actual" != "$digest" ]; then
                echo "Expected $1:latest at $digest, registry returned $actual." >&2
                return 1
              fi
              echo "Published $1:latest at $digest"
            }
            # The China mirror can pick up the home release while Docker Hub is still syncing.
            publish "$HOME_IMAGE"
            printf '%s\n' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            publish "$public_image"
